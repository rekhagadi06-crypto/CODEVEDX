<!DOCTYPE html>
<html>

<head>
    <title>AI Chatbot</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #333;
        }

        #chatbox {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
        }

        #response {
            margin-top: 20px;
            color: blue;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <div id="chatbox">

        <h1>AI Helpdesk Chatbot</h1>

        <input type="text" id="userInput"
               placeholder="Ask something...">

        <button onclick="sendMessage()">
            Send
        </button>

        <div id="response"></div>

    </div>

    <script>

        function sendMessage() {

            let message =
                document.getElementById("userInput").value;

            fetch(`/get?msg=${message}`)

            .then(response => response.text())

            .then(data => {

                document.getElementById("response").innerHTML =
                    data;

            });

        }

    </script>

</body>
</html>
